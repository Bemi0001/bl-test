<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Act+Acre Product Page</title>
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/component.css" />
</head>

<body>
    <header class="site-header">
        <button class="mobile-menu-button" type="button" aria-label="Open menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <button class="mobile-search-button" type="button" aria-label="Search">
            <img src="./assets/icons/search.svg" alt="" />
        </button>

        <a href="#" class="site-logo" aria-label="Act+Acre home">
            <picture>
                <source media="(max-width: 767px)" srcset="./assets/icons/logom.svg" />
                <img src="./assets/icons/logo.svg" alt="Act+Acre logo" />
            </picture>
        </a>

        <nav class="main-nav" aria-label="Main navigation">
            <a href="#">Shop</a>
            <a href="#">Science</a>
            <a href="#">Press</a>
            <a href="#">Blogs</a>
            <a href="#">Tutorial</a>
        </nav>

        <div class="header-actions">
            <button class="icon-button desktop-search" type="button" aria-label="Search">
                <img src="./assets/icons/search.svg" alt="" />
            </button>

            <button class="icon-button" type="button" aria-label="Account">
                <img src="./assets/icons/customer.svg" alt="" />
            </button>

            <button class="icon-button cart-button is-empty" type="button" aria-label="Cart">
                <img src="./assets/icons/cart.svg" alt="" />
                <span class="cart-count">0</span>
            </button>
        </div>

        <div class="mobile-menu" aria-hidden="true">
            <button class="mobile-menu-close" type="button" aria-label="Close menu">
                ×
            </button>

            <nav class="mobile-nav" aria-label="Mobile navigation">
                <a href="#">Shop</a>
                <a href="#">Science</a>
                <a href="#">Press</a>
                <a href="#">Blogs</a>
                <a href="#">Tutorial</a>
            </nav>
        </div>
    </header>

    <main>

    </main>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
